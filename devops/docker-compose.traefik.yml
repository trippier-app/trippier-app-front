# Traefik routes, added ONLY by `make dev`. Attaches the web app to the shared
# trippier-edge network so the Traefik of docker-compose.edge.yml can reach it
# (the .localhost TLD resolves to 127.0.0.1 natively, no /etc/hosts edits).
#
#   http://app.trippier.localhost:8100       -> front
#   http://traefik.trippier.localhost:8100   -> Traefik dashboard (also on :8101)
#
# The API is served by the trippier-app-back stack on
# http://api.app.trippier.localhost:8100 — start that one first, or set API_URL
# to wherever your backend runs.

services:

  front:
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-front.rule=Host(`app.trippier.localhost`)"
      - "traefik.http.services.app-front.loadbalancer.server.port=3000"

networks:
  edge:
    external: true
    name: trippier-edge
