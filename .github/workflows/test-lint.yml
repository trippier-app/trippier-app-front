name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - run: bun run lint

  types:
    name: Type-check
    runs-on: ubuntu-latest
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - run: bun run types:check

  build:
    name: Build
    runs-on: ubuntu-latest
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          API_URL: http://localhost:3001
